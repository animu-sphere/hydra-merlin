name: Vulkan and Hydra capability CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulkan-headless:
    name: Vulkan 1.4 headless / ${{ matrix.build_type }}
    runs-on: [self-hosted, Windows, X64, vulkan-1.4]
    timeout-minutes: 30
    env:
      OST_HOME: ${{ github.workspace }}/.ost-ci-home
      MSBUILDDISABLENODEREUSE: 1
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Restore the LunarG Vulkan SDK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/vulkan-sdk/1.4.350.0
          key: lunarg-vulkan-sdk-windows-x64-1.4.350.0-vma

      - name: Provision the LunarG Vulkan SDK
        shell: pwsh
        run: .github/scripts/setup-vulkan.ps1

      - name: Verify Vulkan 1.4 driver capability
        shell: pwsh
        run: |
          vulkaninfoSDK --summary | Out-File -Encoding utf8 vulkaninfo-summary.txt

      - name: Bootstrap pinned ost 0.23.8
        shell: pwsh
        run: .github/scripts/setup-ost.ps1 -Version 0.23.8

      - name: Configure Vulkan headless
        shell: pwsh
        run: cmake -S . -B build-native -A x64

      - name: Build
        run: >-
          cmake --build build-native --config ${{ matrix.build_type }}
          --parallel 4 -- /nodeReuse:false

      - name: Run reproducibility, Gaussian, viewport, headless smoke, and validation tests
        run: >-
          ctest --test-dir build-native -C ${{ matrix.build_type }}
          -R "^merlin-(render-world|render-extraction|render-backend|backend-boundaries|gaussian-(resource|preparation)|shader-(contract|abi)|render-product-contract|render-artifacts|viewport-vulkan|benchmark-(json|compare)|install-consumer|release-metadata|vulkan-(gaussian-raster|execution-lifetime|resource-update|gpu-scene-upload|material-resources|bindless-residency|offscreen|validation|install-runtime))$"
          --output-on-failure --verbose

      - name: Record descriptor selection and exhaustion evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-native/evidence | Out-Null
          $headless = "build-native/adapters/merlin-headless/${{ matrix.build_type }}/merlin-headless.exe"
          & $headless --probe --descriptor-backend automatic `
            --metadata build-native/evidence/descriptor-automatic.json
          if ($LASTEXITCODE -ne 0) { throw "automatic descriptor probe failed" }
          & $headless --probe --descriptor-backend conventional `
            --metadata build-native/evidence/descriptor-forced-conventional.json
          if ($LASTEXITCODE -ne 0) { throw "forced conventional descriptor probe failed" }
          $capacityOutput = & $headless --frames 1 --width 64 --height 64 `
            --descriptor-backend bindless --bindless-texture-capacity 4 `
            --metadata build-native/evidence/descriptor-capacity.json `
            --output build-native/evidence/capacity-unexpected.ppm 2>&1 |
            Out-String
          $capacityExit = $LASTEXITCODE
          $capacityOutput | Out-File -Encoding utf8 `
            build-native/evidence/descriptor-capacity-exhaustion.log
          if ($capacityExit -eq 0) {
            throw "undersized bindless texture table unexpectedly rendered"
          }
          if ($capacityOutput -notmatch "bindless texture table: exhausted \(capacity=4") {
            throw "bindless exhaustion output was not actionable: $capacityOutput"
          }
          exit 0

      - name: Record the current Release renderer benchmark
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            build-native/evidence/benchmark-current | Out-Null
          $evidence = "build-native/evidence/benchmark-current"
          $current = "build-native/adapters/merlin-benchmark/Release/merlin-benchmark.exe"
          $arguments = @(
            "--fixture", "reference", "--width", "512", "--height", "512",
            "--steady-frames", "120"
          )
          & $current @arguments --output "$evidence/current.json"
          if ($LASTEXITCODE -ne 0) { throw "current benchmark failed" }

      - name: Validate the OpenStrata renderer lifecycle
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          ost runtime pull cy2026 --profile core
          if ($LASTEXITCODE -ne 0) { throw "OpenStrata core runtime pull failed" }
          ost build --jobs 4 --progress plain
          if ($LASTEXITCODE -ne 0) { throw "OpenStrata renderer build failed" }
          ost test
          if ($LASTEXITCODE -ne 0) { throw "OpenStrata renderer tests failed" }
          ost validate --json |
            Tee-Object -FilePath .ost-ci/renderer-validate.json
          if ($LASTEXITCODE -ne 0) { throw "OpenStrata renderer validation failed" }

      - name: Upload Vulkan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vulkan-headless-${{ matrix.build_type }}-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            vulkaninfo-summary.txt
            .ost-ci/*.json
            .strata/targets/*/build.log
            build/*/renderer-report.json
            build-native/renderer-report.json
            build-native/tests/merlin-vulkan-capabilities.json
            build-native/tests/merlin-benchmark*.json
            build-native/adapters/merlin-viewport/viewport-benchmark.json
            build-native/evidence
            build-native/tests/merlin-validation.ppm
            build-native/tests/offscreen-artifacts
            build-native/tests/validation-artifacts
            build-native/tests/render-artifacts
            build-native/Testing/Temporary/LastTest.log

  hydra:
    name: OpenUSD ${{ matrix.openusd }} HgiVulkan
    runs-on: [self-hosted, Windows, X64, vulkan-1.4]
    timeout-minutes: 60
    env:
      OST_HOME: ${{ github.workspace }}/.ost-ci-home
      MSBUILDDISABLENODEREUSE: 1
      OST_RUNTIME_ARTIFACT: ${{ matrix.artifact_digest }}
      OST_RUNTIME_REMOTE: ${{ matrix.oci_reference }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - openusd: "26.05"
            artifact_digest: sha256:e6944385f7b53e5c029c258503b053a9ab1cab2ad7e0f676b403f3d79b17b4fd
            oci_reference: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:44471d4b66caebc61af2ad69225102a01fc611056136fbffe6bc8e1a38dc1eda
          - openusd: "26.08"
            artifact_digest: sha256:baa53948498586283d4ad0ee94d9b00357f885fe022b972d627de8ec6367592e
            oci_reference: oci://ghcr.io/animu-sphere/openstrata-runtime-cy2026-usd@sha256:29118734a8048313cf7bd8774e23e3cc8477226eae7cdd85002f73af286f109a

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Restore the LunarG Vulkan SDK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/vulkan-sdk/1.4.350.0
          key: lunarg-vulkan-sdk-windows-x64-1.4.350.0-vma

      - name: Provision the LunarG Vulkan SDK
        shell: pwsh
        run: .github/scripts/setup-vulkan.ps1

      - name: Verify Vulkan 1.4 driver capability
        shell: pwsh
        run: |
          vulkaninfoSDK --summary | Out-Null

      - name: Bootstrap pinned ost 0.23.8
        shell: pwsh
        run: .github/scripts/setup-ost.ps1 -Version 0.23.8

      - name: Restore the pinned runtime cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ost-ci-home/artifacts
          key: ost-runtime-windows-cy2026-usd-${{ env.OST_RUNTIME_ARTIFACT }}

      - name: Pull and materialize the HgiVulkan runtime
        shell: pwsh
        run: .github/scripts/setup-openusd.ps1 -Version ${{ matrix.openusd }} -ValidateRuntime

      - name: Configure Hydra
        shell: pwsh
        run: cmake -S . -B build -A x64 -DMERLIN_ENABLE_HYDRA2=ON "-DCMAKE_PREFIX_PATH=$env:OPENUSD_ROOT"

      - name: Build
        run: >-
          cmake --build build --config Release
          --parallel 4 -- /nodeReuse:false

      - name: Run discovery, bridge, RenderBuffer, and viewport tests
        run: ctest --test-dir build -C Release -R "^merlin-(hydra2-(discovery|render-buffer|hgi-vulkan-bridge)|viewport-(vulkan|hydra))$" --output-on-failure

      - name: Run Tier 0 and HgiVulkan usdview regressions
        run: ctest --test-dir build -C Release -R "^merlin-hydra2-usdview-(smoke|hgi-vulkan-smoke|hgi-vulkan-comparison)$" --output-on-failure --verbose

      - name: Upload usdview evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hydra-usdview-${{ matrix.openusd }}-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .ost-ci/*.json
            build/adapters/merlin-hydra2/usdview-install/*.log
            build/adapters/merlin-hydra2/usdview-install/*.json
            build/adapters/merlin-hydra2/usdview-install/*.png
            build/adapters/merlin-hydra2/usdview-hgi-vulkan-install/*.log
            build/adapters/merlin-hydra2/usdview-hgi-vulkan-install/*.json
            build/adapters/merlin-hydra2/usdview-hgi-vulkan-install/*.png
            build/adapters/merlin-hydra2/usdview-hgi-vulkan-comparison.json
            build/adapters/merlin-viewport/viewport*.json
            build/Testing/Temporary/LastTest.log

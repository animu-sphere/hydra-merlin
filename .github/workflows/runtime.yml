name: Scheduled runtime evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 0'

permissions:
  contents: read

concurrency:
  group: runtime-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metal:
    name: Metal capability / macOS / ${{ matrix.build_type }}
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Provision pinned Slang
        run: bash .github/scripts/setup-slang.sh
      - name: Configure Metal runtime tests
        run: >-
          cmake --preset metal -B build-runtime -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMERLIN_BUILD_VIEWPORT=ON
      - name: Build
        run: cmake --build build-runtime --parallel 4
      - name: Run Metal capability tests and retain explicit skip reasons
        # Hosted macOS may not expose a suitable GPU. Skips are retained as
        # missing capability and never establish runtime support or timing gates.
        run: >-
          ctest --test-dir build-runtime --output-on-failure --no-tests=error
          -L '^(gpu|runtime)$' --output-junit runtime-tests.xml
      - name: Upload Metal runtime capability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metal-runtime-capability-${{ matrix.build_type }}
          if-no-files-found: warn
          path: |
            build-runtime/runtime-tests.xml
            build-runtime/Testing/Temporary/LastTest.log

name: Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.preset }} / ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-14]
        build_type: [Debug, Release]
        preset: [core]
        viewport: ["OFF"]
        include:
          - os: macos-14
            build_type: Debug
            preset: metal
            viewport: "ON"
          - os: macos-14
            build_type: Release
            preset: metal
            viewport: "ON"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configure Core-only (Windows)
        if: runner.os == 'Windows'
        run: cmake --preset ${{ matrix.preset }} -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure Core-only (Linux)
        if: runner.os == 'Linux'
        run: cmake --preset ${{ matrix.preset }} -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMERLIN_BUILD_VIEWPORT=${{ matrix.viewport }}

      - name: Install pinned Slang for Metal
        if: matrix.preset == 'metal'
        shell: bash
        run: |
          case "$(uname -m)" in
            arm64) slang_arch=aarch64; slang_sha=13949e0fc81f5c0bcde9a195190706740f1cc77af9c558f9f1b598e9bea3c606 ;;
            x86_64) slang_arch=x86_64; slang_sha=ff143c6fb6d6aa08545c1f4c68f14df06a92d52bccd5ad9cf2810ccd9cd61bfa ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 3 \
            "https://github.com/shader-slang/slang/releases/download/v2026.8/slang-2026.8-macos-${slang_arch}.tar.gz" \
            -o "$RUNNER_TEMP/slang.tar.gz"
          echo "$slang_sha  $RUNNER_TEMP/slang.tar.gz" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/slang"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang"
          echo "$RUNNER_TEMP/slang/bin" >> "$GITHUB_PATH"
          xcrun --find metal

      - name: Configure Core or Metal (macOS)
        if: runner.os == 'macOS'
        run: cmake --preset ${{ matrix.preset }} -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DMERLIN_BUILD_VIEWPORT=${{ matrix.viewport }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Test source and install-tree consumers
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

  materialx:
    name: MaterialX generation / ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install MaterialX package dependencies (Linux)
        if: runner.os == 'Linux'
        # The pinned MaterialXConfig.cmake requires X11/Xt on Linux even when
        # the MaterialX render modules are disabled. No display is needed.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libx11-dev libxt-dev

      # FetchContent uses the authoritative MaterialXGenSlang commit in CMake.
      # An empty slangc cache entry keeps this gate independent of GPU SDKs;
      # SPIR-V/Metal target compilation belongs to a separate evidence gate.
      - name: Configure MaterialX generation (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake --preset materialx -B build-materialx -G "Visual Studio 17 2022" -A x64
          -DMERLIN_FETCH_MATERIALX=ON
          -DMERLIN_MATERIALX_SLANGC_EXECUTABLE:FILEPATH=

      - name: Configure MaterialX generation (Linux)
        if: runner.os == 'Linux'
        run: >-
          cmake --preset materialx -B build-materialx -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DMERLIN_FETCH_MATERIALX=ON
          -DMERLIN_MATERIALX_SLANGC_EXECUTABLE:FILEPATH=

      - name: Build Core and MaterialX
        run: cmake --build build-materialx --config ${{ matrix.build_type }} --parallel 4

      - name: Test generation, ABI, diagnostics, and install-tree consumers
        run: >-
          ctest --test-dir build-materialx --build-config ${{ matrix.build_type }}
          --output-on-failure --no-tests=error --output-junit materialx-tests.xml

      - name: Upload MaterialX generation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: materialx-generation-${{ matrix.os }}-${{ matrix.build_type }}
          if-no-files-found: warn
          path: |
            build-materialx/materialx-tests.xml
            build-materialx/tests/materialx-*.slang
            build-materialx/Testing/Temporary/LastTest.log
